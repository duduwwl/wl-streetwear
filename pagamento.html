<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05070e">
  <title>Status do pagamento — WL Streetwear</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css?v=20260814b">
</head>
<body>
  <nav class="editorial-nav"><a class="logo" href="index.html" aria-label="WL Streetwear">W<span>L</span><small>STREETWEAR / EST. 2026</small></a><div class="nav-links"><a href="colecao.html">Coleção</a><a href="index.html#manifesto">Sobre a WL</a></div><div class="nav-actions"><a class="nav-contact" href="index.html#contato">Contato</a></div></nav>
  <main class="section"><div class="statement-inner" style="max-width:680px;margin:70px auto"><span class="label">WL / pagamento</span><h1 id="paymentTitle">Processando<br>pagamento.</h1><p class="section-copy" id="paymentCopy" style="max-width:520px">Aguarde a confirmação do Mercado Pago. Você poderá voltar à loja a qualquer momento.</p><a class="button" href="colecao.html">Voltar para a coleção <span>→</span></a></div></main>
  <script>
    const status = new URLSearchParams(location.search).get('status');
    const messages = {
      approved: ['Pagamento aprovado.', 'Seu pedido foi recebido e será confirmado pela equipe da WL Streetwear.'],
      pending: ['Pagamento pendente.', 'Assim que o Mercado Pago confirmar o pagamento, o pedido seguirá para separação.'],
      failure: ['Pagamento não concluído.', 'Nenhum valor foi confirmado. Você pode voltar à loja e tentar novamente.']
    };
    if (messages[status]) { document.getElementById('paymentTitle').innerHTML = messages[status][0].replace(' ', '<br>'); document.getElementById('paymentCopy').textContent = messages[status][1]; }
  </script>
</body>
</html>
